name: Daily data refresh

# Scrapes SEC Thailand filings into Neon and recomputes CEO scores so the
# deployed app stays current. Does NOT post to Twitter (bot is out of scope).

on:
  schedule:
    # 14:00 UTC ≈ 21:00 ICT — well after the SET market close.
    - cron: "0 14 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button, handy for demos

# Avoid overlapping runs writing to the DB at the same time.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scraper
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      # Selenium 4 ships Selenium Manager, which auto-resolves the matching
      # chromedriver, so installing Chrome is enough.
      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape SEC filings (full refresh into Neon)
        run: python main.py

      - name: Recompute CEO scores
        run: python calculate_scores.py
